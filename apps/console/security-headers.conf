# 02 G7: the console loads nothing but its own files, so injected markup
# could run no remote script, style or image even if it ever rendered.
# Included in every block that adds a header, since nginx drops the outer
# block's add_header wherever a location sets its own.
add_header Content-Security-Policy "default-src 'self'; img-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
