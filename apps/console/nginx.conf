# 02 G6: the path without its query, and no referer or user agent, which the
# client writes; this file is included at http level, where log_format lives.
log_format path_only '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 8080;
    access_log /var/log/nginx/access.log path_only;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Docker's DNS, read at request time: a recreated api keeps working
    # without restarting the console.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        set $api_upstream api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        # Replaced, never appended: the api trusts only this proxy, so the
        # operator address it audits is the one nginx saw (02 G3).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
    }

    # Hashed names change with every build, so they can be kept for good;
    # index.html is revalidated on every load, or a browser keeps running the
    # bundle of an old deploy against the new api.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
