# 02 G6: the path without its query, and no referer or user agent, which the
# client writes; this file is included at http level, where log_format lives.
log_format path_only '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 8080;
    access_log /var/log/nginx/access.log path_only;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Docker's DNS, read at request time: a recreated api keeps working
    # without restarting the console.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 02 G7: the console loads nothing but its own files, so injected markup
    # could run no remote script, style or image even if it ever rendered.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        set $api_upstream api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        # Replaced, never appended: the api trusts only this proxy, so the
        # operator address it audits is the one nginx saw (02 G3).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
