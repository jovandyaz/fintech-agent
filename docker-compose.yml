name: fintech-agent

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot}
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 20

  core-mock:
    build:
      context: .
      dockerfile: apps/core-mock/Dockerfile
    environment:
      CORE_MOCK_PORT: 3010
      CORE_READ_KEY: ${CORE_READ_KEY:-dev-core-read-key}
      CORE_EXECUTOR_KEY: ${CORE_EXECUTOR_KEY:-dev-core-executor-key}
      CORE_DB_PATH: /var/lib/core-mock/core.db
    ports:
      - '${CORE_MOCK_PORT:-3010}:3010'
    volumes:
      - core-mock-data:/var/lib/core-mock
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3010/health || exit 1']
      interval: 2s
      timeout: 3s
      retries: 20

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    environment:
      MCP_PORT: 3020
      MCP_AUDIENCE: ${MCP_AUDIENCE:-http://mcp:3020/mcp}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-mcp}
      CASE_TOKEN_KEY: ${CASE_TOKEN_KEY:-dev-case-token-key-0123456789abcdef}
      CORE_MOCK_URL: http://core-mock:3010
      CORE_READ_KEY: ${CORE_READ_KEY:-dev-core-read-key}
    ports:
      - '${MCP_PORT:-3020}:3020'
    depends_on:
      core-mock:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3020/health || exit 1']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
  core-mock-data:
